<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原神 RTA 比較プレイヤー</title>
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
  <style>
    :root {
      --bg:      #07090f;
      --sf:      #0d1120;
      --sf2:     #131929;
      --sf3:     #1a2235;
      --bd:      #243050;
      --bd2:     #1d2a40;
      --gold:    #c8a050;
      --blue:    #5eadd6;
      --green:   #5ec898;
      --red:     #e05555;
      --text:    #d8e0f0;
      --mu:      #5a6a88;
      --mu2:     #3a4a68;
      --inp:     #080c16;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Header ── */
    #hdr {
      flex-shrink: 0;
      background: linear-gradient(180deg,#060810,var(--sf));
      border-bottom: 1px solid var(--bd);
      padding: 7px 14px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .title-b {
      display: flex; align-items: center; gap: 8px; margin-right: 6px;
    }
    .title-ico {
      width: 30px; height: 30px;
      background: linear-gradient(135deg,var(--gold),#8a5e10);
      border-radius: 6px; display: flex; align-items: center;
      justify-content: center; font-size: 1rem; flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(200,160,80,.4);
    }
    .title-b h1 { font-size: .9rem; font-weight: 700; color: var(--gold); letter-spacing: .06em; }
    .title-b .sub { font-size: .6rem; color: var(--mu); letter-spacing: .08em; text-transform: uppercase; }
    .sep { width: 1px; height: 24px; background: var(--bd); margin: 0 2px; }

    .mbtn {
      display: flex; align-items: center; gap: 4px;
      padding: 5px 10px; border: 1px solid var(--bd); border-radius: 6px;
      background: var(--sf3); color: var(--mu);
      font-size: .76rem; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: all .13s; user-select: none;
    }
    .mbtn:hover { border-color: var(--gold); color: var(--gold); background: rgba(200,160,80,.07); }
    .mbtn.g  { border-color: rgba(94,200,152,.4); color: var(--green); }
    .mbtn.g:hover { background: rgba(94,200,152,.1); }
    .mbtn.b  { border-color: rgba(94,173,214,.4); color: var(--blue); }
    .mbtn.b:hover { background: rgba(94,173,214,.1); }
    .mbtn.a  { border-color: rgba(200,160,80,.4); color: var(--gold); }
    .mbtn.a:hover { background: rgba(200,160,80,.1); }
    .mbtn.r  { border-color: rgba(224,85,85,.4); color: var(--red); }
    .mbtn.r:hover { background: rgba(224,85,85,.1); }

    .add-g { margin-left: auto; display: flex; gap: 6px; }
    .add-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 5px 10px; border: 1px dashed var(--bd2);
      border-radius: 6px; background: transparent;
      color: var(--mu); font-size: .76rem; cursor: pointer; transition: all .13s;
    }
    .add-btn:hover { border-color: var(--gold); color: var(--gold); }
    .kbd { font-size: .58rem; color: var(--mu2); border: 1px solid var(--bd2); border-radius: 3px; padding: 1px 4px; }

    /* ── Grid ── */
    #pw { flex: 1; overflow-y: auto; overflow-x: hidden; }
    #pg {
      display: grid; grid-template-columns: 1fr;
      min-height: 100%; gap: 2px; background: #040609;
    }

    /* ── Panel ── */
    .panel { background: var(--sf); display: flex; flex-direction: column; min-height: 0; }

    .p-head {
      flex-shrink: 0; display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; background: var(--sf2);
      border-bottom: 1px solid var(--bd2);
    }
    .p-badge { font-size: .58rem; font-weight: 700; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }
    .p-badge.loc { background: rgba(94,173,214,.13); color: var(--blue); border: 1px solid rgba(94,173,214,.2); }
    .p-lbl { flex:1; background:transparent; border:none; color:var(--text); font-size:.8rem; font-weight:600; outline:none; cursor:text; min-width:0; }
    .p-lbl::placeholder { color:var(--mu); }
    .p-close { width:20px; height:20px; display:flex; align-items:center; justify-content:center; border:1px solid transparent; border-radius:4px; background:transparent; color:var(--mu); cursor:pointer; font-size:.76rem; transition:all .13s; flex-shrink:0; }
    .p-close:hover { border-color:var(--red); color:var(--red); background:rgba(224,85,85,.1); }
    .p-del { display:flex; align-items:center; gap:3px; padding:3px 8px; border:1px solid rgba(224,85,85,.35); border-radius:4px; background:transparent; color:var(--red); font-size:.68rem; cursor:pointer; transition:all .13s; flex-shrink:0; }
    .p-del:hover { background:rgba(224,85,85,.15); border-color:var(--red); }

    /* ── Video area ── */
    .va { flex:1; position:relative; background:#000; min-height:140px; }
    .va iframe, .va video { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .va audio { display:none; }

    .setup-p { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; }
    .setup-ico { font-size:1.8rem; opacity:.4; }
    .setup-hint { color:var(--mu); font-size:.78rem; text-align:center; line-height:1.6; }
    .setup-row  { display:flex; gap:8px; width:100%; max-width:370px; }
    .setup-inp { flex:1; padding:7px 12px; background:var(--inp); border:1px solid var(--bd); border-radius:7px; color:var(--text); font-size:.8rem; outline:none; transition:border-color .13s; }
    .setup-inp:focus { border-color:var(--gold); }
    .setup-inp::placeholder { color:var(--mu2); }
    .setup-go { padding:7px 14px; background:var(--gold); color:#080c14; border:none; border-radius:7px; font-size:.8rem; font-weight:700; cursor:pointer; flex-shrink:0; }
    .setup-go:hover { opacity:.85; }
    .file-lbl { display:flex; align-items:center; gap:7px; padding:8px 16px; background:var(--sf3); border:1px dashed var(--bd); border-radius:7px; color:var(--mu); font-size:.78rem; cursor:pointer; transition:all .13s; }
    .file-lbl:hover { border-color:var(--blue); color:var(--blue); }
    .audio-ph { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:#040710; color:var(--mu); }
    .audio-ph .big { font-size:2.2rem; }
    .audio-ph .fn  { font-size:.76rem; max-width:180px; text-align:center; word-break:break-all; }
    .load-ov { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:10px; background:rgba(0,0,0,.75); font-size:.8rem; color:var(--mu); }
    .spin { width:18px; height:18px; border:2px solid var(--bd2); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Controls ── */
    .p-ctrl { flex-shrink:0; padding:7px 10px; background:var(--sf2); border-top:1px solid var(--bd2); display:flex; flex-direction:column; gap:6px; }

    /* Seek row with marker overlay */
    .seek-row { display:flex; align-items:center; gap:6px; }
    .tdisp { font-size:.66rem; font-family:monospace; color:var(--mu); min-width:40px; }
    .tdisp.r { text-align:right; }
    .seek-wrap { flex:1; position:relative; height:16px; display:flex; align-items:center; }
    .seek-wrap input[type="range"] { position:relative; z-index:2; width:100%; margin:0; }

    /* Segment marks on seek bar */
    .seek-marks { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); height:20px; pointer-events:none; z-index:1; }
    .seek-hover { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--gold); pointer-events:none; z-index:5; display:none; box-shadow:0 0 6px rgba(200,160,80,.7); }
    .seek-preview {
      position:absolute; bottom:24px; transform:translateX(-50%);
      background:var(--sf3); border:1px solid var(--gold); border-radius:5px;
      padding:3px; pointer-events:none; z-index:30; display:none;
      box-shadow:0 4px 14px rgba(0,0,0,.6);
    }
    .seek-preview canvas { display:block; width:320px; height:180px; background:#000; border-radius:3px; }
    .seek-preview .pt { font-size:.66rem; text-align:center; color:var(--gold); margin-top:3px; font-family:monospace; font-weight:600; }
    .seek-preview.no-frame canvas { display:none; }
    .seek-preview.no-frame { padding:5px 9px; }
    .sm {
      position:absolute; top:50%; transform:translate(-50%,-50%);
      width:3px; height:14px; border-radius:1.5px;
      background:var(--gold); opacity:.7; transition:background .15s, height .15s;
    }
    .sm.cur { background:var(--green); height:18px; opacity:1; }

    input[type="range"] {
      -webkit-appearance:none; appearance:none;
      flex:1; height:3px; border-radius:2px;
      background:var(--bd2); outline:none; cursor:pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
      background:var(--gold); cursor:pointer; transition:transform .1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform:scale(1.35); }
    .vol-rng { max-width:68px; }
    .vol-rng::-webkit-slider-thumb { background:var(--blue); }

    /* Button row */
    .ctrl-row { display:flex; align-items:center; gap:4px; flex-wrap:nowrap; }
    .cb {
      width:28px; height:28px; display:flex; align-items:center; justify-content:center;
      border:1px solid var(--bd2); border-radius:5px; background:var(--sf3); color:var(--mu);
      cursor:pointer; font-size:.76rem; transition:all .12s; flex-shrink:0; user-select:none;
    }
    .cb:hover { border-color:var(--gold); color:var(--gold); }
    .cb.g { border-color:rgba(94,200,152,.35); color:var(--green); }
    .cb.g:hover { background:rgba(94,200,152,.1); }
    .cb.b-on { background:rgba(94,173,214,.15); border-color:var(--blue); color:var(--blue); }
    .cb.seg-nav { border-color:rgba(200,160,80,.35); color:var(--gold); font-size:.65rem; }
    .cb.seg-nav:hover { background:rgba(200,160,80,.1); }
    .cb.seg-nav:disabled { opacity:.25; cursor:default; border-color:var(--bd2); color:var(--mu2); background:transparent; }
    .cg { flex:1; }
    .spd { background:var(--sf3); border:1px solid var(--bd2); border-radius:5px; color:var(--text); font-size:.7rem; padding:3px 4px; cursor:pointer; outline:none; max-width:58px; }
    .spd:focus { border-color:var(--gold); }
    .vol-ico { font-size:.78rem; cursor:pointer; flex-shrink:0; }

    /* Offset row */
    .off-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .off-lbl { font-size:.66rem; color:var(--mu); white-space:nowrap; }
    .off-inp { width:68px; background:var(--inp); border:1px solid var(--bd2); border-radius:5px; color:var(--text); font-size:.7rem; padding:3px 6px; text-align:center; outline:none; }
    .off-inp:focus { border-color:var(--gold); }
    .sync-here { font-size:.66rem; padding:3px 8px; background:transparent; border:1px solid rgba(200,160,80,.4); border-radius:5px; color:var(--gold); cursor:pointer; white-space:nowrap; transition:all .12s; }
    .sync-here:hover { background:rgba(200,160,80,.1); }
    .seg-end-tog { font-size:.62rem; padding:3px 7px; background:transparent; border:1px solid var(--bd2); border-radius:5px; color:var(--mu); cursor:pointer; white-space:nowrap; transition:all .12s; }
    .seg-end-tog:hover { border-color:var(--green); color:var(--green); }
    .seg-end-tog.on { border-color:var(--green); color:var(--green); background:rgba(94,200,152,.12); box-shadow:0 0 0 1px var(--green) inset; }
    .off-info { font-size:.63rem; color:var(--gold); margin-left:auto; }

    /* ── Segment Section ── */
    .seg-sec { flex-shrink:0; border-top:1px solid var(--bd2); background:rgba(0,0,0,.2); }

    /* Scan progress */
    .scan-prog { display:none; align-items:center; gap:8px; padding:6px 12px; }
    .scan-prog.show { display:flex; }
    .scan-bar-w { flex:1; height:4px; background:var(--bd2); border-radius:2px; overflow:hidden; }
    .scan-bar   { height:100%; background:linear-gradient(90deg,var(--gold),var(--blue)); border-radius:2px; transition:width .3s; width:0%; }
    .scan-txt   { font-size:.65rem; color:var(--mu); white-space:nowrap; min-width:90px; }

    /* Segment buttons */
    .seg-btns {
      display:flex; gap:5px; padding:5px 8px;
      flex-wrap:wrap; flex-shrink:0;
      align-content:flex-start; /* don't stretch rows when min-height is forced */
    }
    .seg-btns:empty::before { content:"セグメントなし"; color:var(--mu2); font-size:.65rem; align-self:center; }
    .seg-btn {
      display:flex; flex-direction:column; align-items:center;
      padding:5px 10px; border:1px solid var(--bd2); border-radius:7px;
      background:var(--sf3); cursor:pointer; transition:all .13s; flex-shrink:0; gap:1px;
      min-width:56px;
    }
    .seg-btn:hover { border-color:var(--gold); transform:translateY(-1px); }
    .seg-btn.cur {
      border-color:var(--green);
      background:rgba(94,200,152,.18);
      box-shadow: 0 0 0 1px var(--green), 0 0 8px rgba(94,200,152,.45);
    }
    @keyframes segPulse {
      0%,100% { box-shadow: 0 0 0 1px var(--green), 0 0 6px rgba(94,200,152,.35); }
      50%     { box-shadow: 0 0 0 1px var(--green), 0 0 12px rgba(94,200,152,.7); }
    }
    .seg-btn.cur { animation: segPulse 1.6s ease-in-out infinite; }
    .seg-btn .sn { font-size:.58rem; color:var(--mu); font-weight:700; }
    .seg-btn .st { font-size:.74rem; font-family:monospace; color:var(--text); font-weight:600; }
    .seg-btn.cur .sn { color:var(--green); }
    .seg-btn.cur .st { color:var(--green); }
    .seg-btns::-webkit-scrollbar { height:3px; }
    .seg-btns::-webkit-scrollbar-thumb { background:var(--bd); border-radius:2px; }

    /* ── Empty state ── */
    #empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; color:var(--mu); text-align:center; padding:40px; }
    #empty .eico { font-size:3rem; opacity:.3; }
    #empty h2 { font-size:1rem; color:var(--text); opacity:.6; }
    #empty p { font-size:.8rem; line-height:1.8; max-width:360px; }

    /* Notification */
    #notif { position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--sf2); border:1px solid var(--gold); border-radius:8px; padding:7px 16px; font-size:.8rem; color:var(--gold); transition:transform .25s ease; z-index:999; pointer-events:none; white-space:nowrap; }
    #notif.show { transform:translateX(-50%) translateY(0); }

    /* ── Audio detection ── */
    .aud-wrap {
      border-top: 1px solid var(--bd2);
      padding: 5px 8px 6px;
      background: rgba(0,0,0,.12);
    }
    .aud-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .aud-lbl { font-size:.62rem; color:var(--mu); white-space:nowrap; }
    .aud-ref-btn {
      display:flex; align-items:center; gap:4px;
      font-size:.62rem; padding:3px 8px;
      border:1px dashed var(--bd2); border-radius:4px;
      color:var(--mu); cursor:pointer; white-space:nowrap; transition:all .12s;
    }
    .aud-ref-btn:hover { border-color:var(--blue); color:var(--blue); }
    .aud-ref-name { font-size:.62rem; color:var(--green); max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .thr-rng { max-width:64px; }
    .thr-rng::-webkit-slider-thumb { background:var(--green); }
    .aud-go {
      font-size:.62rem; padding:3px 10px;
      border:1px solid rgba(94,200,152,.4); border-radius:5px;
      background:transparent; color:var(--green);
      cursor:pointer; white-space:nowrap; transition:all .12s;
    }
    .aud-go:hover:not(:disabled) { background:rgba(94,200,152,.1); }
    .aud-go:disabled { opacity:.3; cursor:default; }
    .thr-val { font-size:.62rem; color:var(--green); min-width:2.5ch; text-align:right; }

    /* ── Drag & drop overlay ── */
    #dragov { position:fixed; inset:0; background:rgba(7,9,15,.85); z-index:9998; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); pointer-events:none; }
    #dragov.show { display:flex; }
    .dragov-card { padding:40px 60px; border:3px dashed var(--gold); border-radius:14px; color:var(--gold); font-size:1.4rem; font-weight:700; text-align:center; background:rgba(13,17,32,.9); box-shadow:0 0 40px rgba(200,160,80,.3); }
    .dragov-card .sub { font-size:.85rem; color:var(--mu); font-weight:500; margin-top:8px; }


    /* Scroll */
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--bd); border-radius:3px; }
  </style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div id="hdr">
  <div class="title-b">
    <div class="title-ico">⚔</div>
    <div>
      <h1>原神 RTA 比較プレイヤー</h1>
      <div class="sub">Genshin Impact — Run Comparison</div>
    </div>
  </div>

  <div class="sep"></div>
  <button class="mbtn g" onclick="masterToggle()"    title="全動画 再生/停止 [Space]">▶⏸ 全体 <span class="kbd">Space</span></button>
  <button class="mbtn a" onclick="masterSyncPlay()"  title="オフセット同期再生 [S]">⟳ 同期再生 <span class="kbd">S</span></button>
  <button class="mbtn"   onclick="masterReset()"     title="全動画リセット [R]">↩ リセット <span class="kbd">R</span></button>
  <div class="sep"></div>
  <button class="mbtn r" onclick="masterMuteAll()" title="全ミュート [M]">🔇 全ミュート</button>
  <span class="mbtn" style="cursor:default;padding:3px 6px;gap:6px" title="全パネルの音量">
    🔊
    <input type="range" id="mvol" min="0" max="100" value="100" step="1"
      oninput="masterVol(this.value)"
      style="width:88px;vertical-align:middle">
    <span id="mvolt" style="font-size:.65rem;color:var(--mu);min-width:3ch">100</span>
  </span>
  <span class="mbtn" style="cursor:default;padding:3px 6px;gap:4px" title="全パネルの再生速度">
    ⏩
    <select id="mspd" onchange="masterSpeed(parseFloat(this.value))" style="background:var(--sf3);border:1px solid var(--bd2);border-radius:4px;color:var(--text);font-size:.7rem;padding:2px 4px;outline:none">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option><option value="1" selected>1×</option>
      <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
  </span>

  <div class="add-g">
    <button class="add-btn" onclick="addPanel('local')">📁 動画ファイル追加</button>
  </div>
</div>

<!-- ═══ Panels ═══ -->
<div id="pw">
  <div id="pg">
    <div id="empty">
      <div class="eico">⚔️</div>
      <h2>比較したいRTA動画を追加してください</h2>
      <p>ローカル動画を読み込むと自動でロード画面を検出し<br>セグメントに分割します。シークバーにマーカーが表示され<br>クリックで各セグメントへ瞬時に移動できます。</p>
    </div>
  </div>
</div>

<div id="notif"></div>

<script>
/* ═══ State ═══ */
let _pid=0;
const panels={};
const timers={};

/* ═══ Helpers ═══ */
const $=id=>document.getElementById(id);
function fmt(sec){
  if(!isFinite(sec)||sec<0)sec=0;
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}
function fmtShort(sec){ // e.g. "1:23" or "45.2s"
  if(sec<60) return sec.toFixed(1)+'s';
  return fmt(sec);
}
function notif(msg){
  const el=$('notif');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2800);
}
function updateGrid(){
  const n=Object.keys(panels).length;
  const cols=n<=1?1:n===3?3:Math.min(n,2);
  $('pg').style.gridTemplateColumns=`repeat(${cols},1fr)`;
  $('empty').style.display=n===0?'flex':'none';
}

/* ═══ Player Abstraction (HTML5 video/audio only) ═══ */
const getP =id=>panels[id]?.player;
function pPlay(id)    { const p=getP(id);if(!p)return;p.play().catch(()=>{}); }
function pPause(id)   { const p=getP(id);if(!p)return;p.pause(); }
function pSeek(id,t)  { const p=getP(id);if(!p)return;t=Math.max(0,t);p.currentTime=t; }
function pTime(id)    { const p=getP(id);if(!p)return 0;return p.currentTime||0; }
function pDur(id)     { const p=getP(id);if(!p)return 0;return p.duration||0; }
function pVol(id,v)   { const p=getP(id);if(!p)return;panels[id].vol=v;p.volume=v; }
function pMute(id,m)  { const p=getP(id);if(!p)return;panels[id].muted=m;p.muted=m; }
function pSpeed(id,r) { const p=getP(id);if(!p)return;p.playbackRate=r; }
function pPlaying(id) {
  const p=getP(id);if(!p)return false;
  return !p.paused&&!p.ended;
}

/* ═══ Add Panel ═══ */
function addPanel(type){
  try {
    const id='p'+(++_pid), num=_pid;
    panels[id]={id,type,player:null,offset:0,muted:false,vol:1,ready:false,duration:0,segments:[],curSeg:-1,blobUrl:null};
    if(typeof WARP_DATA_URL !== 'undefined' && typeof _audRefs !== 'undefined'){
      _audRefs[id]={ dataUrl: WARP_DATA_URL, name:'warp.mp3' };
    }
    const grid=$('pg');
    const div=document.createElement('div');
    div.className='panel'; div.id=id;
    div.innerHTML=buildHTML(id,type,num);
    grid.appendChild(div);
    panels[id].el=div;
    updateGrid();
  } catch(err) {
    console.error('addPanel failed:', err);
    notif('❌ パネル追加エラー: ' + (err?.message ?? err));
  }
}

function buildLocSetup(id){
  return `<div class="setup-p" id="sp_${id}">
    <div class="setup-ico">📁</div>
    <div class="setup-hint">動画ファイルを選択（MP4 / WebM / MOV など）</div>
    <label class="file-lbl">📂 ファイルを選択<input type="file" accept="video/*,audio/*" style="display:none" onchange="loadLocal('${id}',this)"></label>
  </div>`;
}

/* ═══ Load Local File ═══ */
function loadLocal(id,inp){
  const file=inp.files[0]; if(!file)return;
  loadLocalFile(id, file);
}
function loadLocalFile(id, file){
  if(!file || !panels[id]) return;
  const url=URL.createObjectURL(file);
  panels[id].blobUrl=url; panels[id].file=file;
  const isAudio=file.type.startsWith('audio/');
  const va=$('va_'+id); va.innerHTML='';

  const lblEl=$('lbl_'+id);
  if(lblEl&&lblEl.value.startsWith('走者')){ lblEl.value=file.name.replace(/\.[^.]+$/,''); panels[id].label=lblEl.value; }

  if(isAudio){
    const ph=document.createElement('div'); ph.className='audio-ph';
    ph.innerHTML=`<div class="big">🎵</div><div class="fn">${file.name}</div>`;
    va.appendChild(ph);
    const audio=document.createElement('audio'); audio.src=url;
    audio.addEventListener('loadedmetadata',()=>onMediaReady(id,audio,file.name,false));
    audio.addEventListener('play',()=>setPlayBtn(id,true));
    audio.addEventListener('pause',()=>setPlayBtn(id,false));
    audio.addEventListener('ended',()=>setPlayBtn(id,false));
    va.appendChild(audio);
  } else {
    const video=document.createElement('video'); video.src=url;
    video.addEventListener('loadedmetadata',()=>onMediaReady(id,video,file.name,true));
    video.addEventListener('play',()=>setPlayBtn(id,true));
    video.addEventListener('pause',()=>setPlayBtn(id,false));
    video.addEventListener('ended',()=>setPlayBtn(id,false));
    va.appendChild(video);
  }
}

function onMediaReady(id,el,name,scannable){
  panels[id].player=el; panels[id].ready=true; panels[id].duration=el.duration;
  showCtrl(id); startTick(id);
  notif(`ファイルを読み込みました: ${name} ✓`);
  if(scannable) startAudioScan(id); // kick off background audio scan
}

/* ═══ UI helpers ═══ */
function showCtrl(id){ const c=$('ctrl_'+id); if(c)c.style.display='flex'; }
function setPlayBtn(id,playing){
  const b=$('pb_'+id); if(!b)return;
  b.textContent=playing?'⏸':'▶'; b.title=playing?'一時停止':'再生';
  b.className=playing?'cb b-on':'cb g';
}

/* ═══ Tick ═══ */
const _tn={};
function startTick(id){ if(timers[id])clearInterval(timers[id]); timers[id]=setInterval(()=>tick(id),200); }
function tick(id){
  if(!panels[id]?.ready)return;
  const t=pTime(id), dur=pDur(id)||panels[id].duration||0;
  if(dur>panels[id].duration)panels[id].duration=dur;

  const ct=$('ct_'+id); if(ct)ct.textContent=fmt(t);
  const dt=$('dt_'+id); if(dt)dt.textContent=fmt(panels[id].duration);

  const sk=$('sk_'+id);
  if(sk&&panels[id].duration>0){
    const pct=(t/panels[id].duration)*100;
    sk.value=pct;
    sk.style.background=`linear-gradient(to right,var(--gold) ${pct}%,var(--bd2) ${pct}%)`;
  }

  // Update active segment highlight every tick (real-time response)
  updateCurSeg(id, t);
}

/* ═══ Seek ═══ */
const _seekRAF = {};      // id → pending requestAnimationFrame id

function onSeekInput(id,val){
  const dur=panels[id]?.duration||0;
  if(!dur) return;
  const t=(val/100)*dur;
  const ct=$('ct_'+id); if(ct) ct.textContent=fmt(t);
  const sk=$('sk_'+id); if(sk) sk.style.background=`linear-gradient(to right,var(--gold) ${val}%,var(--bd2) ${val}%)`;
  // Live segment highlight while dragging
  updateCurSeg(id, t);

  // Live preview seek — scrub the video so the frame at `t` is shown immediately
  if(true){
    if(_seekRAF[id]) cancelAnimationFrame(_seekRAF[id]);
    _seekRAF[id] = requestAnimationFrame(()=>{
      _seekRAF[id] = null;
      pSeek(id, t);
    });
  }
}
function onSeekChange(id,val){
  const dur=panels[id]?.duration||0;
  if(!dur) return;
  if(_seekRAF[id]){ cancelAnimationFrame(_seekRAF[id]); _seekRAF[id] = null; }
  // Always commit the final position on release/click
  pSeek(id, (val/100)*dur);
}

// One-click seek: <input type=range> sometimes only nudges the thumb without
// firing input on the first click in some browsers. This computes the click
// position directly and seeks immediately, guaranteeing instant response.
function onSeekClick(id, e){
  if(e.button !== 0) return;
  const sw = $('sw_'+id); if(!sw) return;
  const dur = panels[id]?.duration || 0; if(!dur) return;
  const r = sw.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const t = pct * dur;
  const sk = $('sk_'+id);
  if(sk){
    sk.value = pct * 100;
    sk.style.background = `linear-gradient(to right,var(--gold) ${pct*100}%,var(--bd2) ${pct*100}%)`;
  }
  const ct = $('ct_'+id); if(ct) ct.textContent = fmt(t);
  updateCurSeg(id, t);
  pSeek(id, t);
}

// Seek-bar hover: shows a thumbnail of the video at that position.
function onSeekHover(id, e){
  const p = panels[id]; if(!p) return;
  const dur = p.duration || 0; if(!dur) return;
  const sw = $('sw_'+id), sh = $('sh_'+id), spv = $('spv_'+id), spvt = $('spvt_'+id);
  if(!sw || !sh || !spv) return;

  const r = sw.getBoundingClientRect();
  const x = Math.max(0, Math.min(r.width, e.clientX - r.left));
  const t = (x / r.width) * dur;

  sh.style.left    = x + 'px';
  sh.style.display = 'block';

  // Clamp tooltip horizontally inside the seek-wrap
  const previewW = 340;
  const half     = previewW/2;
  const left     = Math.max(half, Math.min(r.width - half, x));
  spv.style.left    = left + 'px';
  spv.style.display = 'block';
  if(spvt) spvt.textContent = fmt(t);

  if(p.blobUrl){
    spv.classList.remove('no-frame');
    drawSeekPreview(id, t);
  } else {
    spv.classList.add('no-frame');
  }
}

function onSeekLeave(id){
  const sh  = $('sh_'+id), spv = $('spv_'+id);
  if(sh)  sh.style.display  = 'none';
  if(spv) spv.style.display = 'none';
}

// Hidden video used solely for seek-bar thumbnails.
// Independent from panel.player so it doesn't disturb playback.
const _previewState = {}; // id → { video, busy, pendingT }
function drawSeekPreview(id, t){
  const p = panels[id]; if(!p?.blobUrl) return;
  let st = _previewState[id];
  if(!st){
    const v = document.createElement('video');
    v.src = p.blobUrl;
    v.muted = true;
    v.preload = 'auto';
    v.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(v);
    st = _previewState[id] = { video: v, busy: false, pendingT: null };
    v.addEventListener('seeked', ()=>{
      const cnv = $('spvc_'+id);
      if(cnv){
        const ctx = cnv.getContext('2d');
        try { ctx.drawImage(v, 0, 0, cnv.width, cnv.height); } catch(e){}
      }
      st.busy = false;
      if(st.pendingT !== null){
        const next = st.pendingT;
        st.pendingT = null;
        st.busy = true;
        try { v.currentTime = next; } catch(e){ st.busy = false; }
      }
    });
  }
  if(st.busy){ st.pendingT = t; return; }
  st.busy = true;
  try { st.video.currentTime = t; } catch(e){ st.busy = false; }
}
function relSeek(id,d){ pSeek(id,pTime(id)+d); }
function togglePlay(id){ if(!panels[id]?.ready)return; pPlaying(id)?pPause(id):pPlay(id); }

/* ═══ Volume / Mute ═══ */
function onVolInput(id,val){
  const v=val/100; pVol(id,v); panels[id].vol=v;
  const vi=$('vi_'+id); if(vi)vi.textContent=v===0?'🔇':v<0.5?'🔉':'🔊';
  const vr=$('vr_'+id); if(vr)vr.style.background=`linear-gradient(to right,var(--blue) ${val}%,var(--bd2) ${val}%)`;
  if(v>0&&panels[id].muted){panels[id].muted=false;pMute(id,false);}
}
function toggleMute(id){
  const p=panels[id];if(!p)return;
  p.muted=!p.muted; pMute(id,p.muted);
  const vi=$('vi_'+id); if(vi)vi.textContent=p.muted?'🔇':p.vol<0.5?'🔉':'🔊';
}

/* ═══ Offset ═══ */
function setOffset(id,val){
  panels[id].offset=parseFloat(val)||0;
  const el=$('oi2_'+id);
  if(el)el.textContent=panels[id].offset!==0?`(${panels[id].offset>0?'+':''}${panels[id].offset}s)`:'';
}
function syncHere(id){
  const t=pTime(id); panels[id].offset=t;
  const oi=$('oi_'+id); if(oi)oi.value=t.toFixed(2);
  const el=$('oi2_'+id); if(el)el.textContent=`📌 ${fmt(t)}`;
  notif(`📍 ${$('lbl_'+id)?.value||id}: ${fmt(t)} を同期基準に設定`);
}

// Toggle auto-sync of offset to current segment's end time. While ON,
// every time the current segment changes (playback or click), the panel's
// offset auto-updates to that segment's `end`. Useful for RTA loading-screen
// alignment.
function toggleAutoSegEnd(id){
  const p = panels[id]; if(!p) return;
  p.autoSegEnd = !p.autoSegEnd;
  const btn = $('seg_end_tog_'+id);
  if(btn) btn.classList.toggle('on', !!p.autoSegEnd);
  if(p.autoSegEnd){
    notif(`🏁 ${$('lbl_'+id)?.value||id}: セグメント末尾自動同期 ON`);
    applyAutoSegEnd(id);
  } else {
    notif(`🏁 ${$('lbl_'+id)?.value||id}: 自動同期 OFF`);
  }
}
function applyAutoSegEnd(id){
  const p = panels[id]; if(!p?.autoSegEnd) return;
  const idx = p.curSeg;
  const seg = (idx>=0) ? p.segments?.[idx] : null;
  if(!seg) return;
  const t = seg.end;
  p.offset = t;
  const oi = $('oi_'+id); if(oi) oi.value = t.toFixed(2);
  const el = $('oi2_'+id); if(el) el.textContent = `🏁 Seg${seg.n}末尾 ${fmt(t)}`;
}

/* ═══ Remove Panel ═══ */
function removePanel(id){
  if(!panels[id])return;
  if(panels[id].ready)pPause(id);
  if(panels[id].blobUrl)URL.revokeObjectURL(panels[id].blobUrl);
  if(panels[id]._scanAbort)panels[id]._scanAbort=true;
  clearInterval(timers[id]); delete timers[id];
  if(_previewState[id]){
    try { _previewState[id].video.pause(); _previewState[id].video.removeAttribute('src'); _previewState[id].video.remove(); } catch(e){}
    delete _previewState[id];
  }
  delete _audRefs[id];
  $('pg').querySelector('#'+id)?.remove();
  delete panels[id];
  updateGrid();
  if(typeof equalizeSegHeights==='function') equalizeSegHeights();
  notif('パネルを削除しました');
}

/* ═══ Segment Navigation ═══ */
function gotoSeg(id, idx){
  const segs=panels[id]?.segments; if(!segs||!segs[idx])return;
  pSeek(id, segs[idx].start);
  updateCurSeg(id, segs[idx].start);
}

function prevSeg(id){
  const p=panels[id]; if(!p?.segments?.length)return;
  const t=pTime(id);
  // Find the segment whose start is just before current time
  let target=-1;
  for(let i=p.segments.length-1;i>=0;i--){
    if(p.segments[i].start < t-0.5){ target=i; break; }
  }
  if(target>=0){ gotoSeg(id,target); notif(`⏮ Seg ${target+1}`); }
}

function nextSeg(id){
  const p=panels[id]; if(!p?.segments?.length)return;
  const t=pTime(id);
  let target=-1;
  for(let i=0;i<p.segments.length;i++){
    if(p.segments[i].start > t+0.5){ target=i; break; }
  }
  if(target>=0){ gotoSeg(id,target); notif(`⏭ Seg ${target+1}`); }
}

function updateCurSeg(id, t){
  const p=panels[id]; if(!p?.segments?.length)return;
  let cur=-1;
  for(let i=p.segments.length-1;i>=0;i--){
    if(t>=p.segments[i].start){ cur=i; break; }
  }
  if(cur===p.curSeg)return;
  p.curSeg=cur;

  // Update button highlights + auto-scroll active button into view
  const btns=$('segbtns_'+id)?.querySelectorAll('.seg-btn');
  btns?.forEach((b,i)=>{
    const on = i===cur;
    b.classList.toggle('cur', on);
    if(on) b.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  });

  // Update seek bar markers
  const marks=$('sm_'+id)?.querySelectorAll('.sm');
  marks?.forEach((m,i)=>m.classList.toggle('cur',i===cur));

  // Update prev/next buttons
  const psb=$('psb_'+id), nsb=$('nsb_'+id);
  if(psb)psb.disabled=cur<=0&&(cur===0);
  if(nsb)nsb.disabled=cur>=p.segments.length-1;

  // Auto segment-end offset
  if(p.autoSegEnd) applyAutoSegEnd(id);
}

/* ═══ Segment Scan ═══ */

// ──────────────────────────────────────────────────────────────
//  Seek helper
// ──────────────────────────────────────────────────────────────
function seekVideo(video, time){
  return new Promise(resolve=>{
    let done=false;
    const finish=()=>{ if(done)return; done=true; resolve(); };
    video.addEventListener('seeked', finish, {once:true});
    video.currentTime=time;
    setTimeout(finish, 700); // fallback if seeked never fires
  });
}

// ──────────────────────────────────────────────────────────────
//  Frame analysis
//
//  原神ロード画面の特徴:
//    夜パターン: 背景ほぼ真っ黒 (#1b1c25)  → 暗ピクセル割合 >= 55%
//    昼パターン: 背景ほぼ真っ白 (#f0f0f0)  → 明ピクセル割合 >= 55%
//
//  単純な平均輝度ではなく「割合」で判定することで
//  中央の木アイコンやテキストによる誤判定を防ぐ
// ──────────────────────────────────────────────────────────────
function detectLoadFrame(ctx, w, h){
  try {
    const px = ctx.getImageData(0, 0, w, h).data;
    const n  = w * h;
    let dark=0, bright=0;
    for(let i=0; i<px.length; i+=4){
      // 輝度 (BT.601)
      const lum = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
      if(lum < 45)  dark++;    // 夜ロード背景: 輝度 ~27
      if(lum > 210) bright++;  // 昼ロード背景: 輝度 ~240
    }
    const dPct = dark   / n;
    const bPct = bright / n;
    // 55%以上が極端に暗い or 明るい → ロード画面と判定
    return { isLoad: dPct >= 0.55 || bPct >= 0.55, dPct, bPct };
  } catch(e) {
    return { isLoad: false, dPct: 0, bPct: 0 };
  }
}

// ──────────────────────────────────────────────────────────────
//  Background scan (video load 完了後に自動実行)
// ──────────────────────────────────────────────────────────────
async function scanSegments(id){
  const panel = panels[id];
  if(!panel?.blobUrl) return;

  const duration = panel.duration;
  if(!duration || duration <= 0) return;

  // UI: スキャン開始
  const prog   = $('scanprog_'+id);
  const barEl  = $('scanbar_'+id);
  const txtEl  = $('scantxt_'+id);
  const segBtns= $('segbtns_'+id);
  if(prog)    prog.classList.add('show');
  if(segBtns) segBtns.innerHTML = '';

  // サンプリング間隔 (短いほど精度が上がるが時間がかかる)
  const interval = duration < 120 ? 0.5 : duration < 600 ? 1 : 1.5;

  // スキャン専用のvideoを作成 (メイン再生に影響しない)
  const sv = document.createElement('video');
  sv.muted = true;
  sv.preload = 'auto';
  sv.src = panel.blobUrl;

  // metadata & seekable を待つ
  await new Promise(r => {
    const onReady = () => { sv.removeEventListener('loadedmetadata', onReady); r(); };
    sv.addEventListener('loadedmetadata', onReady);
    setTimeout(r, 5000);
  });
  // 最初のフレームを読めるまで少し待つ
  await seekVideo(sv, 0);
  await new Promise(r => setTimeout(r, 100));

  // キャンバス (64×36 = 2304px: 精度と速度のバランス)
  const W = 64, H = 36;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const steps  = Math.floor(duration / interval);
  const frames = []; // [{t, isLoad, dPct, bPct}]

  panel._scanAbort = false;

  for(let i = 0; i <= steps; i++){
    if(panel._scanAbort) break;

    const t = Math.min(i * interval, duration);
    await seekVideo(sv, t);
    ctx.drawImage(sv, 0, 0, W, H);
    const det = detectLoadFrame(ctx, W, H);
    frames.push({ t, ...det });

    // プログレス更新 (5ステップごと)
    if(i % 5 === 0){
      const pct = Math.round((i / steps) * 100);
      if(barEl) barEl.style.width = pct + '%';
      if(txtEl) txtEl.textContent = `スキャン中… ${pct}%`;
      await new Promise(r => setTimeout(r, 0)); // UIを一瞬解放
    }
  }

  sv.src = ''; // スキャンvideoを解放

  if(panel._scanAbort){ if(prog) prog.classList.remove('show'); return; }

  // ── フレーム列からセグメントを抽出 ──────────────────────────
  //
  // ノイズ除去: 1フレームだけの孤立したisLoadは隣と合わせる
  // (短い誤検出をスムージング)
  //
  const raw = frames.map(f => f.isLoad);
  const smoothed = raw.map((cur, i) => {
    const prev = i > 0           ? raw[i-1] : cur;
    const next = i < raw.length-1 ? raw[i+1] : cur;
    // 両隣が違う→スパイク→隣の値に従う
    return (cur === prev || cur === next) ? cur : prev;
  });

  // ロード画面が終わった瞬間 (isLoad: true→false) でセグメントを区切る
  const segments = [];
  let segStart = null;

  for(let i = 0; i < frames.length; i++){
    const isLoad   = smoothed[i];
    const prevLoad = i > 0 ? smoothed[i-1] : isLoad;
    const t        = frames[i].t;

    // ゲームプレイ開始: ロード終了 or 最初のゲームプレイフレーム
    if(!isLoad && segStart === null){
      segStart = t;
    }

    // ゲームプレイ終了: ゲーム→ロードへ遷移
    if(isLoad && !prevLoad && segStart !== null){
      const endT = frames[i-1]?.t ?? t;
      segments.push({ n: segments.length+1, start: segStart, end: endT, dur: endT - segStart });
      segStart = null;
    }

    // ロード終了 → 次のゲームプレイ開始
    if(!isLoad && prevLoad){
      segStart = t;
    }
  }
  // 最後のセグメントを閉じる
  if(segStart !== null){
    const endT = frames[frames.length-1].t;
    segments.push({ n: segments.length+1, start: segStart, end: endT, dur: endT - segStart });
  }

  panel.segments = segments;
  panel.curSeg   = -1;

  if(prog) prog.classList.remove('show');
  renderSegmentUI(id);

  const label = $('lbl_'+id)?.value || id;
  if(segments.length > 0){
    notif(`✓ ${label}: ${segments.length}個のセグメントを検出`);
  } else {
    notif(`⚠ ${label}: セグメントが検出されませんでした`);
  }
}

function renderSegmentUI(id){
  const p=panels[id]; if(!p)return;
  const segs=p.segments;

  // ── Segment buttons ──
  const btns=$('segbtns_'+id);
  if(btns){
    btns.innerHTML='';
    segs.forEach((s,i)=>{
      const b=document.createElement('button');
      b.className='seg-btn';
      b.title=`Seg ${s.n}: ${fmt(s.start)} → ${fmt(s.end)}`;
      b.innerHTML=`<div class="sn">${s.n}</div><div class="st">${fmtShort(s.dur)}</div>`;
      b.onclick=()=>gotoSeg(id,i);
      btns.appendChild(b);
    });
  }

  // ── Seek bar markers ──
  renderSeekMarkers(id);

  // ── Enable prev/next buttons ──
  const psb=$('psb_'+id), nsb=$('nsb_'+id);
  if(psb)psb.disabled=segs.length===0;
  if(nsb)nsb.disabled=segs.length===0;

  // ── Equalize seg-btns heights across panels (so video areas align) ──
  equalizeSegHeights();
}

// Match every .seg-btns container's min-height to the tallest one. Keeps the
// video viewports aligned even when one panel has many more segments than another.
let _segEqualizeRAF = null;
function equalizeSegHeights(){
  if(_segEqualizeRAF) cancelAnimationFrame(_segEqualizeRAF);
  _segEqualizeRAF = requestAnimationFrame(()=>{
    _segEqualizeRAF = null;
    const containers = document.querySelectorAll('.seg-btns');
    if(!containers.length) return;
    let max = 0;
    containers.forEach(c => { c.style.minHeight = ''; max = Math.max(max, c.offsetHeight); });
    containers.forEach(c => { c.style.minHeight = max + 'px'; });
  });
}
window.addEventListener('resize', () => equalizeSegHeights());

function renderSeekMarkers(id){
  const p=panels[id]; if(!p)return;
  const dur=p.duration; if(!dur)return;
  const container=$('sm_'+id); if(!container)return;

  container.innerHTML='';
  p.segments.forEach((s,i)=>{
    const pct=(s.start/dur)*100;
    const m=document.createElement('div');
    m.className='sm';
    m.style.left=pct+'%';
    m.title=`Seg ${s.n}: ${fmt(s.start)}`;
    m.style.cursor='pointer';
    m.style.pointerEvents='auto';
    m.onclick=(e)=>{ e.stopPropagation(); gotoSeg(id,i); };
    container.appendChild(m);
  });
}

/* ═══ Master Controls ═══ */
function readyIds(){ return Object.keys(panels).filter(id=>panels[id].ready); }

function masterPlay(){ readyIds().forEach(id=>pPlay(id)); }
function masterPause(){ readyIds().forEach(id=>pPause(id)); }
// Toggle: if any panel is playing → pause all; otherwise → play all
function masterToggle(){
  const ids = readyIds(); if(!ids.length) return;
  const anyPlaying = ids.some(id => pPlaying(id));
  if(anyPlaying) masterPause(); else masterPlay();
}

// Master volume: applies the same volume (0..1) to every ready panel and
// syncs each panel's own volume slider/icon.
function masterVol(val){
  const v = Math.max(0, Math.min(1, val/100));
  const lbl = $('mvolt'); if(lbl) lbl.textContent = Math.round(val);
  readyIds().forEach(id => {
    panels[id].vol = v;
    pVol(id, v);
    if(v > 0 && panels[id].muted){ panels[id].muted = false; pMute(id, false); }
    const vi = $('vi_'+id); if(vi) vi.textContent = panels[id].muted || v===0 ? '🔇' : v<0.5 ? '🔉' : '🔊';
    const vr = $('vr_'+id);
    if(vr){
      vr.value = val;
      vr.style.background = `linear-gradient(to right,var(--blue) ${val}%,var(--bd2) ${val}%)`;
    }
  });
}

// Master speed: applies the same playbackRate to every ready panel and
// updates each panel's own speed selector.
function masterSpeed(rate){
  readyIds().forEach(id => {
    pSpeed(id, rate);
    const sel = panels[id].el?.querySelector('.spd');
    if(sel) sel.value = String(rate);
  });
}

function masterSyncPlay(refId=null){
  const ids=readyIds(); if(!ids.length)return;
  const ref=(refId&&panels[refId]?.ready)?refId:ids[0];
  const refT=pTime(ref), refOff=panels[ref].offset;
  ids.forEach(id=>{ const tgt=refT-refOff+panels[id].offset; pSeek(id,tgt); });
  setTimeout(()=>ids.forEach(id=>pPlay(id)),120);
  notif(`⟳ ${$('lbl_'+ref)?.value||ref} 基準で同期再生`);
}

function masterReset(){
  readyIds().forEach(id=>{pPause(id);pSeek(id,panels[id].offset);});
  notif('↩ 全パネルをリセット');
}
function masterMuteAll(){
  readyIds().forEach(id=>{panels[id].muted=true;pMute(id,true);const vi=$('vi_'+id);if(vi)vi.textContent='🔇';});
  notif('🔇 全ミュート');
}
function masterUnmuteAll(){
  readyIds().forEach(id=>{panels[id].muted=false;pMute(id,false);const vi=$('vi_'+id);if(vi)vi.textContent=panels[id].vol<0.5?'🔉':'🔊';});
  notif('🔊 全解除');
}

const WARP_DATA_URL = 'data:audio/mpeg;base64,' + WARP_B64;


const _audRefs = {}; // id -> { file, name }

function onRefFile(id, input){
  const f = input.files[0]; if(!f) return;
  _audRefs[id] = { file: f };
  const arn = document.getElementById('arn_'+id); if(arn) arn.textContent = f.name;
  const btn = document.getElementById('audgo_'+id); if(btn) btn.disabled = false;
}

async function startAudioScan(id){
  const panel = panels[id];
  if(!panel){ return; }
  if(!panel.blobUrl){ notif('動画ファイルを読み込んでください'); return; }
  const ref = _audRefs[id];
  if(!ref){ notif('参照音声ファイルを選択してください'); return; }

  const btn    = document.getElementById('audgo_'+id);
  const prog   = document.getElementById('scanprog_'+id);
  const bar    = document.getElementById('scanbar_'+id);
  const txt    = document.getElementById('scantxt_'+id);
  if(btn){ btn.disabled=true; btn.textContent='🔄 処理中…'; }
  if(prog) prog.classList.add('show');

  try {
    const SR    = 8000;
    const FRAME = Math.round(SR * 0.1); // 100ms frames

    const SMALL_THRESHOLD = 100 * 1024 * 1024; // 100MB
    const fileSize = panel.file?.size ?? 0;

    if(bar) bar.style.width = '5%';
    if(txt) txt.textContent = 'セグメントスキャン中…';
    let mainSig;

    // Progress callback: maps internal stages to a single "セグメントスキャン中 NN%" UI
    const reportProg = (baseStart, baseSpan) => (p)=>{
      const pct = baseStart + p * baseSpan;
      if(bar) bar.style.width = `${pct}%`;
      if(txt) txt.textContent = `セグメントスキャン中… ${Math.round(pct)}%`;
    };

    // Path A: small files → direct decodeAudioData (fastest for ≲ 100MB)
    if(!mainSig && fileSize > 0 && fileSize < SMALL_THRESHOLD){
      try {
        mainSig = await decodeMonoSignal(panel.blobUrl, SR);
        if(bar) bar.style.width = '30%';
        if(txt) txt.textContent = 'セグメントスキャン中… 30%';
      } catch(e) {
        console.warn('decodeMonoSignal failed:', e);
        mainSig = null;
      }
    }

    // Path B: WebCodecs + MP4Box demuxing (audio-only, CPU-speed extraction)
    if(!mainSig && panel.file && window.AudioDecoder){
      try {
        mainSig = await extractAudioFast(panel.file, SR, reportProg(5, 25));
      } catch(e) {
        console.warn('extractAudioFast failed:', e);
        mainSig = null;
      }
    }

    // Path C: real-time playback capture (last resort)
    if(!mainSig){
      mainSig = await captureAudioViaPlayback(panel.blobUrl, SR, reportProg(5, 25));
    }

    if(!mainSig) throw new Error('音声取得に失敗しました');

    if(bar) bar.style.width = '40%';
    if(txt) txt.textContent = 'セグメントスキャン中… 40%';
    const refSrc  = ref.file ? URL.createObjectURL(ref.file) : ref.dataUrl;
    const refSig  = await decodeMonoSignal(refSrc, SR);
    if(ref.file) URL.revokeObjectURL(refSrc);

    if(bar) bar.style.width = '55%';
    if(txt) txt.textContent = 'セグメントスキャン中… 55%';
    const mainEnvs = computeMultiBandRms(mainSig, FRAME, SR);
    const refEnvs  = computeMultiBandRms(refSig,  FRAME, SR);

    if(bar) bar.style.width = '75%';
    if(txt) txt.textContent = 'セグメントスキャン中… 75%';
    const thrVal      = parseFloat(document.getElementById('thr_'+id)?.value ?? '0.75');
    const minGapFrames = Math.round(3 / 0.1); // 3s minimum gap between matches
    const times = findMatchPeaksMultiBand(mainEnvs, refEnvs, thrVal, minGapFrames, 0.1);

    if(bar) bar.style.width = '100%';
    if(txt) txt.textContent = `セグメントスキャン完了: ${times.length} 件`;
    buildSegmentsFromTimes(id, times, panel.duration);
    notif(`セグメントスキャン完了: ${times.length} 件 ✓`);
    setTimeout(()=>{ if(prog) prog.classList.remove('show'); }, 1800);
  } catch(err){
    console.error('Segment scan error:', err);
    notif('セグメントスキャンエラー');
    if(txt) txt.textContent = 'エラー';
  } finally {
    if(btn){ btn.disabled=false; btn.textContent='🔍 セグメントスキャン'; }
  }
}

// Stream-capture audio by playing the video at high speed through Web Audio.
// Avoids loading the whole file into an ArrayBuffer (works for 10GB+ files).
// Returns a Float32Array representing the original audio at `targetSR` (effective).
// Fast audio-only extraction using MP4Box.js (demux) + WebCodecs.AudioDecoder.
// Reads the file in chunks via Blob.slice, parses the MP4 container, extracts
// audio packets, and decodes them at CPU speed (no real-time playback).
// 10GB file completes in minutes, not hours.
async function extractAudioFast(file, targetSR, onProgress){
  if(!window.AudioDecoder)  throw new Error('WebCodecs非対応');
  if(!window.MP4Box)        throw new Error('MP4Box.jsロード失敗 (オフライン?)');

  return new Promise((resolve, reject) => {
    const mp4 = MP4Box.createFile();
    let resolved = false;
    let nativeSR = 0, totalDur = 0;
    let decoder = null;
    let chunks = [];
    let lastTs = 0;
    let inputDone = false;
    let pendingDecodes = 0;

    const fail = (e) => { if(!resolved){ resolved = true; reject(e instanceof Error ? e : new Error(String(e))); }};
    const finalize = () => {
      if(resolved) return;
      resolved = true;
      let total = 0;
      for(const c of chunks) total += c.length;
      const cat = new Float32Array(total);
      let off = 0;
      for(const c of chunks){ cat.set(c, off); off += c.length; }
      // Resample nativeSR → targetSR
      if(Math.abs(nativeSR - targetSR) < 1){ resolve(cat); return; }
      const ratio  = nativeSR / targetSR;
      const outLen = Math.floor(cat.length / ratio);
      const out    = new Float32Array(outLen);
      for(let i=0; i<outLen; i++){
        const s = i * ratio;
        const lo = Math.floor(s), hi = Math.min(lo+1, cat.length-1);
        const t  = s - lo;
        out[i] = cat[lo]*(1-t) + cat[hi]*t;
      }
      resolve(out);
    };
    const maybeFinalize = () => {
      if(inputDone && pendingDecodes === 0) finalize();
    };

    mp4.onError = (e) => fail(new Error('MP4解析エラー: ' + e));

    mp4.onReady = (info) => {
      const tr = info.tracks.find(t => t.type === 'audio');
      if(!tr) return fail(new Error('音声トラックが見つかりません'));
      nativeSR  = tr.audio.sample_rate;
      totalDur  = tr.duration / tr.timescale;
      const nCh = tr.audio.channel_count;

      // Extract codec config (AudioSpecificConfig for AAC)
      let description = null;
      try {
        const trak = mp4.getTrackById(tr.id);
        const entry = trak.mdia.minf.stbl.stsd.entries[0];
        if(entry?.esds?.esd?.descs){
          for(const d of entry.esds.esd.descs){
            if(d.tag === 4 && d.descs){
              for(const sub of d.descs){
                if(sub.tag === 5 && sub.data){ description = sub.data; break; }
              }
            }
            if(description) break;
          }
        }
      } catch(e){ /* some codecs don't need description */ }

      decoder = new AudioDecoder({
        output: (ad) => {
          pendingDecodes--;
          const n   = ad.numberOfFrames;
          const nC  = ad.numberOfChannels;
          const out = new Float32Array(n);
          try {
            const buf = new Float32Array(n);
            for(let c=0; c<nC; c++){
              ad.copyTo(buf, { planeIndex: c, format: 'f32-planar' });
              for(let i=0; i<n; i++) out[i] += buf[i];
            }
            if(nC > 1) for(let i=0; i<n; i++) out[i] /= nC;
          } catch(e){
            const il = new Float32Array(n * nC);
            try {
              ad.copyTo(il, { planeIndex: 0, format: 'f32' });
              for(let i=0; i<n; i++){
                let s = 0;
                for(let c=0; c<nC; c++) s += il[i*nC + c];
                out[i] = s / nC;
              }
            } catch(e2){ /* best-effort */ }
          }
          chunks.push(out);
          lastTs = (ad.timestamp + (ad.duration || 0)) / 1e6;
          if(onProgress && totalDur > 0) onProgress(Math.min(lastTs / totalDur, 1));
          ad.close();
          maybeFinalize();
        },
        error: (e) => fail(new Error('AudioDecoder: ' + (e.message || e))),
      });

      try {
        decoder.configure({
          codec: tr.codec,
          sampleRate: nativeSR,
          numberOfChannels: nCh,
          ...(description ? { description } : {}),
        });
      } catch(e){
        return fail(new Error(`デコーダ設定失敗 (${tr.codec}): ${e.message}`));
      }

      mp4.setExtractionOptions(tr.id, null, { nbSamples: 1000 });
      mp4.start();
    };

    mp4.onSamples = (id, user, samples) => {
      if(!decoder || resolved) return;
      for(const s of samples){
        try {
          decoder.decode(new EncodedAudioChunk({
            type:      s.is_sync ? 'key' : 'delta',
            timestamp: (s.cts / s.timescale) * 1e6,
            duration:  (s.duration / s.timescale) * 1e6,
            data:      s.data,
          }));
          pendingDecodes++;
        } catch(e){ /* skip bad chunks */ }
      }
    };

    // Stream the file into MP4Box in chunks (memory stays bounded)
    const CHUNK_SIZE = 8 * 1024 * 1024;
    let offset = 0;

    async function feed(){
      if(resolved) return;
      if(offset >= file.size){
        try { mp4.flush(); } catch(e){}
        inputDone = true;
        if(decoder){
          try { await decoder.flush(); } catch(e){}
          try { decoder.close(); } catch(e){}
        }
        maybeFinalize();
        return;
      }
      try {
        const slice = file.slice(offset, Math.min(offset + CHUNK_SIZE, file.size));
        const buf   = await slice.arrayBuffer();
        buf.fileStart = offset;
        mp4.appendBuffer(buf);
        offset += CHUNK_SIZE;
      } catch(e){
        return fail(new Error('ファイル読込: ' + e.message));
      }
      // Yield to event loop so decode callbacks can run
      setTimeout(feed, 0);
    }
    feed();
  });
}

async function captureAudioViaPlayback(blobUrl, targetSR, onProgress){
  // 16x is technically Chrome's max but huge files (10GB+, 4K) cannot sustain
  // it — the audio element silently stalls within seconds. 4x is a safer rate
  // that completes reliably even for very large files.
  const PLAYBACK_RATE = 4;
  // Use <audio> element instead of <video> — for video files, the browser will
  // extract just the audio track and skip video decoding entirely. This is the
  // ONLY way to sustain 16x playback for large/4K videos (video decoding cannot
  // keep up at 16x and causes silent playback stalls within seconds).
  const video = document.createElement('audio');
  video.src = blobUrl;
  video.preload = 'auto';
  video.crossOrigin = 'anonymous';
  if(video.preservesPitch !== undefined) video.preservesPitch = false;
  document.body.appendChild(video);

  const Actx = window.AudioContext || window.webkitAudioContext;
  let ctx = null, srcNode = null, proc = null, mute = null, progTimer = null;

  try {
    await new Promise((res, rej) => {
      video.addEventListener('loadedmetadata', ()=>res(), {once:true});
      video.addEventListener('error', ()=>rej(new Error('動画メタデータ読み込み失敗')), {once:true});
    });
    const dur = video.duration;
    if(!isFinite(dur) || dur <= 0) throw new Error('動画の長さが取得できません');

    ctx = new Actx();
    if(ctx.state === 'suspended') await ctx.resume();
    const ctxSR = ctx.sampleRate;

    srcNode = ctx.createMediaElementSource(video);
    proc    = ctx.createScriptProcessor(16384, 2, 1);
    const chunks = [];
    proc.onaudioprocess = (e)=>{
      const ib = e.inputBuffer;
      const n  = ib.length;
      const c0 = ib.getChannelData(0);
      const c1 = ib.numberOfChannels > 1 ? ib.getChannelData(1) : c0;
      const out = new Float32Array(n);
      for(let i=0; i<n; i++) out[i] = (c0[i] + c1[i]) * 0.5;
      chunks.push(out);
    };
    mute = ctx.createGain();
    mute.gain.value = 0;
    srcNode.connect(proc);
    proc.connect(mute);
    mute.connect(ctx.destination);

    video.playbackRate = PLAYBACK_RATE;
    await video.play();

    // Poll-based completion detection (do NOT rely solely on `ended`,
    // which can fire prematurely or never under high playbackRate / large files).
    // Also detects stalls and re-applies playbackRate which some browsers reset.
    await new Promise((resolve, reject)=>{
      let lastTime    = -1;
      let stallTicks  = 0;
      let resolved    = false;
      const STALL_TICKS_GIVEUP = 600;  // ~3 minutes of zero progress → give up

      const finish = (err)=>{
        if(resolved) return;
        resolved = true;
        clearInterval(progTimer); progTimer = null;
        video.removeEventListener('error', onErr);
        video.removeEventListener('waiting', onWait);
        video.removeEventListener('playing', onPlay);
        if(err) reject(err); else resolve();
      };
      const onErr  = ()=>finish(new Error(`再生中エラー @ ${video.currentTime.toFixed(1)}s`));
      const onWait = ()=>{ /* buffering — patience */ };
      const onPlay = ()=>{ stallTicks = 0; };

      progTimer = setInterval(()=>{
        const ct = video.currentTime;
        if(onProgress) onProgress(Math.min(ct / dur, 1));

        // Reached the end (within tolerance)
        if(ct >= dur - 0.2) return finish();

        // Re-apply playback rate (browsers reset it on buffering/seeking)
        if(video.playbackRate !== PLAYBACK_RATE) video.playbackRate = PLAYBACK_RATE;

        // Stall detection
        if(Math.abs(ct - lastTime) < 0.001){
          stallTicks++;
          // Aggressive nudge: retry play() every ~3s while stalled
          if(stallTicks % 10 === 0){
            video.play().catch(()=>{});
          }
          if(stallTicks >= STALL_TICKS_GIVEUP){
            console.warn(`captureAudioViaPlayback: stalled ${(stallTicks*0.3).toFixed(0)}s at ${ct.toFixed(1)}s / ${dur.toFixed(1)}s`);
            return finish();
          }
        } else {
          stallTicks = 0;
        }
        lastTime = ct;
      }, 300);

      video.addEventListener('error',   onErr);
      video.addEventListener('waiting', onWait);
      video.addEventListener('playing', onPlay);
    });
    if(onProgress) onProgress(1);

    // Concatenate captured chunks
    let total = 0;
    for(const c of chunks) total += c.length;
    const captured = new Float32Array(total);
    let off = 0;
    for(const c of chunks){ captured.set(c, off); off += c.length; }

    // Captured length in real time = dur / PLAYBACK_RATE seconds.
    // Each captured sample maps to PLAYBACK_RATE/ctxSR seconds of original.
    // Effective SR (in original time) = ctxSR / PLAYBACK_RATE.
    const effectiveSR = ctxSR / PLAYBACK_RATE;
    if(Math.abs(effectiveSR - targetSR) < 1) return captured;

    // Linear-interpolation resample to targetSR (in original time scale)
    const ratio  = effectiveSR / targetSR;
    const outLen = Math.floor(captured.length / ratio);
    const out    = new Float32Array(outLen);
    for(let i=0; i<outLen; i++){
      const sIdx = i * ratio;
      const lo   = Math.floor(sIdx);
      const hi   = Math.min(lo + 1, captured.length - 1);
      const t    = sIdx - lo;
      out[i] = captured[lo]*(1-t) + captured[hi]*t;
    }
    return out;
  } finally {
    if(progTimer) clearInterval(progTimer);
    try { srcNode?.disconnect(); } catch(e){}
    try { proc?.disconnect();    } catch(e){}
    try { mute?.disconnect();    } catch(e){}
    try { await ctx?.close();    } catch(e){}
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch(e){}
    video.remove();
  }
}

async function decodeMonoSignal(source, targetSR){
  let arrayBuffer;
  if(source instanceof File || source instanceof Blob){
    arrayBuffer = await source.arrayBuffer();
  } else if(typeof source === 'string'){
    // Try fetch first; for large blob URLs fetch may fail, so fallback to XHR
    try {
      const resp = await fetch(source);
      if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
      arrayBuffer = await resp.arrayBuffer();
    } catch(fetchErr) {
      arrayBuffer = await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', source, true);
        xhr.responseType = 'arraybuffer';
        xhr.onload  = () => xhr.status===0 || (xhr.status>=200 && xhr.status<300)
          ? resolve(xhr.response)
          : reject(new Error(`XHR失敗 (${xhr.status})`));
        xhr.onerror = () => reject(new Error('XHR ネットワークエラー'));
        xhr.send();
      });
    }
  } else {
    arrayBuffer = source;
  }
  if(!arrayBuffer || arrayBuffer.byteLength === 0)
    throw new Error('音声データが空です');

  const ActxClass = window.AudioContext || window.webkitAudioContext;
  if(!ActxClass) throw new Error('Web Audio APIが非対応のブラウザです');

  // Decode at native rate first (most reliable across browsers)
  const tmpCtx = new ActxClass();
  let nativeBuf;
  try {
    if(tmpCtx.state === 'suspended') await tmpCtx.resume();
    nativeBuf = await new Promise((resolve, reject) =>
      tmpCtx.decodeAudioData(arrayBuffer, resolve, reject)
    );
  } catch(e){
    throw new Error(`音声デコード失敗 — 非対応コーデックの可能性 (${e.message ?? e})`);
  } finally {
    tmpCtx.close();
  }

  // Resample to targetSR via OfflineAudioContext
  const outLen = Math.ceil(nativeBuf.duration * targetSR);
  const offCtx = new OfflineAudioContext(1, outLen, targetSR);
  const src = offCtx.createBufferSource();

  // Mix to mono before resampling to save memory on multi-channel sources
  const monoInBuf = offCtx.createBuffer(1, nativeBuf.length, nativeBuf.sampleRate);
  const monoData  = monoInBuf.getChannelData(0);
  const nCh = nativeBuf.numberOfChannels;
  for(let c=0; c<nCh; c++){
    const ch = nativeBuf.getChannelData(c);
    for(let i=0; i<monoData.length; i++) monoData[i] += ch[i];
  }
  if(nCh > 1) for(let i=0; i<monoData.length; i++) monoData[i] /= nCh;

  src.buffer = monoInBuf;
  src.connect(offCtx.destination);
  src.start(0);
  const rendered = await offCtx.startRendering();
  return rendered.getChannelData(0).slice();
}

function applyLowpass(signal, cutoffHz, sr){
  // One-pole IIR lowpass
  const a = Math.exp(-2 * Math.PI * cutoffHz / sr);
  const b = 1 - a;
  const out = new Float32Array(signal.length);
  let y = 0;
  for(let i=0; i<signal.length; i++){
    y = a*y + b*signal[i];
    out[i] = y;
  }
  return out;
}

function computeMultiBandRms(signal, frameSize, sr){
  // 3 bands: low (0-500Hz), mid (500-2000Hz), high (2000Hz+)
  const lp500  = applyLowpass(signal, 500,  sr);
  const lp2000 = applyLowpass(signal, 2000, sr);
  const N = signal.length;
  const mid  = new Float32Array(N);
  const high = new Float32Array(N);
  for(let i=0; i<N; i++){
    mid[i]  = lp2000[i] - lp500[i];
    high[i] = signal[i]  - lp2000[i];
  }
  return [
    computeRmsEnv(lp500, frameSize),
    computeRmsEnv(mid,   frameSize),
    computeRmsEnv(high,  frameSize),
  ];
}

function findMatchPeaksMultiBand(mainEnvs, refEnvs, thresh, minGap, frameSec){
  const numBands = mainEnvs.length;
  const M = mainEnvs[0].length;
  const R = refEnvs[0].length;
  if(R >= M) return [];

  // Pre-normalize each ref band (z-score)
  const refNorms = refEnvs.map(refEnv => {
    let mean = 0;
    for(let j=0; j<R; j++) mean += refEnv[j];
    mean /= R;
    let varSum = 0;
    for(let j=0; j<R; j++) varSum += (refEnv[j]-mean) ** 2;
    const std = Math.sqrt(varSum/R) || 1e-9;
    const norm = new Float32Array(R);
    for(let j=0; j<R; j++) norm[j] = (refEnv[j]-mean)/std;
    return norm;
  });

  // Per-position score = mean of per-band normalized cross-correlations
  const scores = new Float32Array(M - R + 1);
  for(let i=0; i<=M-R; i++){
    let total = 0;
    for(let b=0; b<numBands; b++){
      const env = mainEnvs[b];
      let wMean = 0;
      for(let j=0; j<R; j++) wMean += env[i+j];
      wMean /= R;
      let wVar = 0;
      for(let j=0; j<R; j++) wVar += (env[i+j]-wMean) ** 2;
      const wStd = Math.sqrt(wVar/R) || 1e-9;
      let corr = 0;
      for(let j=0; j<R; j++) corr += ((env[i+j]-wMean)/wStd) * refNorms[b][j];
      total += corr / R;
    }
    scores[i] = total / numBands;
  }

  // Local-max peak picking within ±minGap window
  const peaks = [];
  for(let i=0; i<scores.length; i++){
    if(scores[i] < thresh) continue;
    const lo = Math.max(0, i - minGap);
    const hi = Math.min(scores.length - 1, i + minGap);
    let isLocalMax = true;
    for(let k=lo; k<=hi; k++){
      if(k !== i && scores[k] > scores[i]){ isLocalMax = false; break; }
    }
    if(isLocalMax) peaks.push((i + R/2) * frameSec);
  }
  return peaks;
}

function computeRmsEnv(signal, frameSize){
  const n   = Math.floor(signal.length / frameSize);
  const env = new Float32Array(n);
  for(let f=0; f<n; f++){
    const off = f * frameSize;
    let sum = 0;
    for(let i=0; i<frameSize; i++) sum += signal[off+i] ** 2;
    env[f] = Math.sqrt(sum / frameSize);
  }
  return env;
}

function findMatchPeaks(mainEnv, refEnv, thresh, minGap, frameSec){
  const M = mainEnv.length;
  const R = refEnv.length;
  if(R >= M) return [];

  // Normalize reference envelope once
  let rMean = 0;
  for(let j=0; j<R; j++) rMean += refEnv[j];
  rMean /= R;
  let rVar = 0;
  for(let j=0; j<R; j++) rVar += (refEnv[j]-rMean)**2;
  const rStd = Math.sqrt(rVar/R) || 1e-9;
  const refN = new Float32Array(R);
  for(let j=0; j<R; j++) refN[j] = (refEnv[j]-rMean)/rStd;

  // Slide window and compute normalized cross-correlation
  const scores = new Float32Array(M - R + 1);
  for(let i=0; i<=M-R; i++){
    let wMean=0;
    for(let j=0; j<R; j++) wMean += mainEnv[i+j];
    wMean /= R;
    let wVar=0;
    for(let j=0; j<R; j++) wVar += (mainEnv[i+j]-wMean)**2;
    const wStd = Math.sqrt(wVar/R) || 1e-9;
    let corr=0;
    for(let j=0; j<R; j++) corr += ((mainEnv[i+j]-wMean)/wStd) * refN[j];
    scores[i] = corr / R;
  }

  // Pick peaks above threshold, enforcing minimum gap
  const peaks = [];
  let lastPeak = -minGap;
  for(let i=0; i<scores.length; i++){
    if(scores[i] >= thresh && i - lastPeak >= minGap){
      peaks.push((i + R/2) * frameSec);
      lastPeak = i;
    }
  }
  return peaks;
}

function buildSegmentsFromTimes(id, times, duration){
  const panel = panels[id]; if(!panel) return;
  const segs = [];
  let prev = 0;
  for(let i=0; i<times.length; i++){
    const end = times[i];
    if(end - prev > 0.5) segs.push({ n:segs.length+1, start:prev, end, dur:end-prev });
    prev = times[i];
  }
  if(duration && duration - prev > 0.5)
    segs.push({ n:segs.length+1, start:prev, end:duration, dur:duration-prev });
  panel.segments = segs;
  panel.curSeg   = -1;
  renderSegmentUI(id);
}

/* ═══ Window-wide Drag & Drop ═══ */
(()=>{
  let dragOv = null;
  const ensureOv = ()=>{
    if(dragOv) return dragOv;
    dragOv = document.createElement('div');
    dragOv.id = 'dragov';
    dragOv.innerHTML = `<div class="dragov-card">📥 ファイルをドロップしてパネル追加<div class="sub">複数ファイル同時ドロップ可</div></div>`;
    document.body.appendChild(dragOv);
    return dragOv;
  };
  let depth = 0;
  window.addEventListener('dragenter', (e)=>{
    if(!e.dataTransfer?.types?.includes('Files')) return;
    e.preventDefault();
    depth++;
    ensureOv().classList.add('show');
  });
  window.addEventListener('dragover', (e)=>{
    if(e.dataTransfer?.types?.includes('Files')) e.preventDefault();
  });
  window.addEventListener('dragleave', (e)=>{
    if(!e.dataTransfer?.types?.includes('Files')) return;
    depth = Math.max(0, depth-1);
    if(depth === 0) ensureOv().classList.remove('show');
  });
  window.addEventListener('drop', (e)=>{
    if(!e.dataTransfer?.files?.length) return;
    e.preventDefault();
    depth = 0;
    ensureOv().classList.remove('show');
    const files = [...e.dataTransfer.files].filter(f =>
      f.type.startsWith('video/') || f.type.startsWith('audio/'));
    if(!files.length){ notif('動画/音声ファイルをドロップしてください'); return; }
    for(const f of files){
      addPanel('local');
      const id = 'p' + _pid;
      loadLocalFile(id, f);
    }
    notif(`${files.length} 個のファイルを追加 ✓`);
  });
})();

/* ═══ Keyboard ═══ */
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  // Space toggles play/pause (any-playing → pause all, all-paused → play all).
  // Shift+Space forces pause as a backup.
  if(e.code==='Space'&&!e.shiftKey){e.preventDefault();masterToggle();}
  if(e.code==='Space'&& e.shiftKey){e.preventDefault();masterPause();}
  if(e.code==='KeyR') masterReset();
  if(e.code==='KeyS') masterSyncPlay();
  if(e.code==='KeyM') masterMuteAll();
});
